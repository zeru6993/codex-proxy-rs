name: Container

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to build and validate
        required: true
        type: string
      source_build:
        description: Validate the complete Docker source build
        type: boolean
        default: true
      export_image:
        description: Export the tested dev image for a separate publishing job
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.metadata.outputs.version }}
      build_time:
        value: ${{ jobs.metadata.outputs.build_time }}
      image_tag:
        value: ${{ jobs.metadata.outputs.image_tag }}

permissions:
  contents: read
  security-events: write

jobs:
  metadata:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      build_time: ${{ steps.metadata.outputs.build_time }}
      image_tag: ${{ steps.metadata.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - id: metadata
        env:
          CPR_GIT_SHA: ${{ inputs.ref }}
          PUBLISH_IMAGE: ${{ inputs.export_image }}
        run: ruby .github/scripts/dev-image.rb metadata >> "$GITHUB_OUTPUT"

  frontend:
    if: ${{ !inputs.source_build }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/build-frontend
        with:
          upload-artifact: 'true'

  binary:
    needs: metadata
    if: ${{ !inputs.source_build }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - id: toolchains
        run: ruby .github/scripts/toolchains.rb >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-binary
        with:
          rust: ${{ steps.toolchains.outputs.rust }}
          target: x86_64-unknown-linux-gnu
          platform: linux-amd64
          rust-image: ${{ steps.toolchains.outputs.rust_image }}
        env:
          CPR_GIT_SHA: ${{ inputs.ref }}
          CPR_VERSION: ${{ needs.metadata.outputs.version }}
          CPR_BUILD_TIME: ${{ needs.metadata.outputs.build_time }}
          CPR_BUILD_TYPE: source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-proxy-rs-linux-amd64
          path: dist/binaries/linux-amd64/
          if-no-files-found: error
          retention-days: 7

  container:
    needs: [metadata, frontend, binary]
    if: always() && !cancelled()
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CPR_IMAGE: codex-proxy-rs:ci-${{ inputs.ref }}
      TRIVY_QUIET: 'true'
      TRIVY_SKIP_VERSION_CHECK: 'true'
    steps:
      - name: Require build metadata
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
        run: test "$METADATA_RESULT" = success

      # 上游失败必须传递给已有的容器检查，不能让必需状态变成 skipped
      - name: Require prebuilt inputs
        if: ${{ !inputs.source_build }}
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BINARY_RESULT: ${{ needs.binary.result }}
        run: test "$FRONTEND_RESULT" = success && test "$BINARY_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Download frontend
        if: ${{ !inputs.source_build }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: dist/docker/web/dist

      - name: Download binary
        if: ${{ !inputs.source_build }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-proxy-rs-linux-amd64
          path: dist/docker-artifacts/codex-proxy-rs-linux-amd64

      - name: Prepare prebuilt image
        if: ${{ !inputs.source_build }}
        env:
          MATRIX_OS: linux
          MATRIX_ARCH: amd64
          MATRIX_BINARY: codex-proxy-rs
          CPR_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          ruby -r './.github/scripts/release-metadata' -e '
            ReleaseMetadata.seal_manifest(
              "version" => ENV.fetch("CPR_VERSION"),
              "git_sha" => ReleaseMetadata.git("rev-parse", "HEAD")
            )'
          ruby .github/scripts/package-release.rb image

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ inputs.source_build && 'runtime' || 'runtime-prebuilt' }}
          build-args: |
            CPR_PREBUILT_DIR=dist/docker
            CPR_GIT_SHA=${{ inputs.ref }}
            CPR_VERSION=${{ needs.metadata.outputs.version }}
            CPR_BUILD_TIME=${{ needs.metadata.outputs.build_time }}
            CPR_BUILD_TYPE=source
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            io.codex-proxy.build-type=source
          load: true
          tags: ${{ env.CPR_IMAGE }}
          no-cache-filters: |
            runtime-base
            runtime
            runtime-prebuilt
          cache-from: type=gha,scope=runtime-${{ inputs.source_build && 'source' || 'prebuilt' }}
          cache-to: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && format('type=gha,mode=max,scope=runtime-{0}', inputs.source_build && 'source' || 'prebuilt') || '' }}

      - name: Verify runtime image
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.CPR_IMAGE }}
          platform: linux/amd64
          artifact-name: container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          expected-git-sha: ${{ inputs.ref }}
          expected-version: ${{ needs.metadata.outputs.version }}
          expected-build-type: source

      - name: Export the tested image
        if: inputs.export_image
        run: |
          set -euo pipefail
          docker image inspect "$CPR_IMAGE" --format '{{.Id}}' > "$RUNNER_TEMP/verified-image-id.txt"
          docker save "$CPR_IMAGE" --output "$RUNNER_TEMP/verified-image.tar"

      - name: Upload the tested image
        if: inputs.export_image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-dev-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verified-image.tar
            ${{ runner.temp }}/verified-image-id.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
